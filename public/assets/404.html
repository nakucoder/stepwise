<!doctype html>
<!--
  Cloudflare Pages serves this, with status 404, for a missing file under /assets/. Without it,
  the single-page-app fallback would answer with index.html and status 200, and the
  /assets/* cache rule in _headers would let browsers keep that wrong answer for a year.
  It must stay inside assets/: a top-level 404.html would turn off the app fallback for
  every route.
-->
<html lang="en">
  <meta charset="utf-8" />
  <title>Not found</title>
  <p>Not found.</p>
</html>
