<!doctype html>
<!--
  Source for public/og-image.png, the 1200×630 link preview card. Serve the repo root (for
  example `python3 -m http.server 8765`), open /design/og/og-image.html in a 1200×630 viewport
  and take a screenshot. Bubble sort mid-swap, drawn with design D tokens: the 3 slides left in
  front while the 8 hops over it, the same motion as the swap animation in the app.
-->
<html lang="en" data-theme="light" data-level="explorer">
  <head>
    <meta charset="utf-8" />
    <title>Stepwise preview card</title>
    <link rel="stylesheet" href="/node_modules/@fontsource-variable/archivo/wdth.css" />
    <link rel="stylesheet" href="/node_modules/@fontsource/atkinson-hyperlegible-next/700.css" />
    <link rel="stylesheet" href="/node_modules/@fontsource/atkinson-hyperlegible-mono/700.css" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background: var(--color-bg);
        color: var(--color-ink);
        font-family: var(--font-text);
      }
      .card {
        display: grid;
        grid-template-rows: 172px 1fr;
        width: 1200px;
        height: 630px;
      }

      .band {
        display: flex;
        align-items: stretch;
        background: var(--cat-sorting);
        color: var(--cat-on-sorting);
        border-bottom: 6px solid var(--color-line);
      }
      .mark {
        display: flex;
        align-items: center;
        padding: 0 40px;
        background: var(--color-ink);
        color: var(--color-bg);
        font-family: var(--font-display);
        font-stretch: var(--display-stretch);
        font-weight: 850;
        font-size: 50px;
      }
      .headline {
        display: flex;
        align-items: center;
        padding: 0 40px;
        font-family: var(--font-display);
        font-stretch: var(--display-stretch);
        font-weight: var(--display-weight);
        font-size: 46px;
        line-height: 1.02;
      }

      .body {
        display: grid;
        grid-template-columns: 1fr 400px;
        min-height: 0;
      }
      .stage {
        position: relative;
        padding: 34px 44px 0;
        border-right: 6px solid var(--color-line);
        background-color: var(--color-stage);
        background-image:
          linear-gradient(var(--color-stage-grid-major) 1px, transparent 1px),
          linear-gradient(90deg, var(--color-stage-grid-major) 1px, transparent 1px),
          linear-gradient(var(--color-stage-grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--color-stage-grid) 1px, transparent 1px);
        background-size:
          100px 100px,
          100px 100px,
          20px 20px,
          20px 20px;
        display: flex;
        flex-direction: column;
      }
      .bars {
        position: relative;
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 14px;
        align-items: end;
        height: 300px;
        border-bottom: 6px solid var(--color-line);
      }
      .bar {
        display: grid;
        place-items: start center;
        padding-top: 10px;
        background: var(--color-bar);
        color: var(--color-on-bar);
        font-family: var(--font-mono);
        font-weight: 700;
        font-size: 34px;
        height: calc(64px + (100% - 64px) * var(--h));
      }
      .bar.swap {
        background: var(--role-swapping);
        color: var(--role-on-swapping);
        outline: 5px solid var(--color-line);
        outline-offset: -5px;
      }
      .bar.sorted {
        background: var(--role-sorted);
        color: var(--role-on-sorted);
      }
      /* Mid-swap: each pink bar is 40% of the way to the other's slot; the 8 hops over the 3. */
      .bar.left-mover {
        transform: translateX(calc(-40% - 5.6px));
        position: relative;
        z-index: 2;
      }
      .bar.right-mover {
        transform: translate(calc(40% + 5.6px), -26px);
        position: relative;
        z-index: 1;
      }
      .marks {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 14px;
        padding-top: 10px;
      }
      .m {
        display: grid;
        justify-items: center;
        align-content: start;
        gap: 4px;
        font-weight: 700;
        font-size: 18px;
      }
      .m .p {
        padding: 2px 10px;
        background: var(--color-ink);
        color: var(--color-bg);
      }
      .m .r {
        padding: 1px 8px;
        background: var(--role-swapping);
        color: var(--role-on-swapping);
      }
      .m .s {
        padding: 1px 8px;
        background: var(--role-sorted);
        color: var(--role-on-sorted);
      }

      .explain {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 30px 34px 30px;
        background: var(--role-comparing);
        color: var(--role-on-comparing);
      }
      .explain h2 {
        margin: 0 0 10px;
        font-size: 22px;
      }
      .explain p {
        margin: 0;
        font-size: 38px;
        font-weight: 700;
        line-height: 1.18;
      }
      .meta {
        font-family: var(--font-mono);
        font-weight: 700;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="band">
        <div class="mark">Stepwise</div>
        <div class="headline">Watch algorithms run,<br />one step at a time</div>
      </div>
      <div class="body">
        <div class="stage">
          <div class="bars">
            <div class="bar" style="--h: 0.222">2</div>
            <div class="bar" style="--h: 0.111">1</div>
            <div class="bar" style="--h: 0.556">5</div>
            <div class="bar swap left-mover" style="--h: 0.333; grid-column: 5; grid-row: 1">3</div>
            <div class="bar swap right-mover" style="--h: 0.889; grid-column: 4; grid-row: 1">
              8
            </div>
            <div class="bar sorted" style="--h: 1; grid-column: 6; grid-row: 1">9</div>
          </div>
          <div class="marks">
            <div class="m"></div>
            <div class="m"></div>
            <div class="m"></div>
            <div class="m"><span class="p">left</span><span class="r">trading</span></div>
            <div class="m"><span class="p">right</span><span class="r">trading</span></div>
            <div class="m"><span class="s">done ✓</span></div>
          </div>
        </div>
        <div class="explain">
          <div>
            <h2>What’s happening</h2>
            <p>Yes! 8 is bigger, so they trade places.</p>
          </div>
          <div class="meta">Bubble sort, step 20 of 34</div>
        </div>
      </div>
    </div>
  </body>
</html>
