<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bath time mockups</title>
    <link rel="stylesheet" href="/node_modules/@fontsource-variable/archivo/wdth.css" />
    <link rel="stylesheet" href="/node_modules/@fontsource/atkinson-hyperlegible-next/400.css" />
    <link rel="stylesheet" href="/node_modules/@fontsource/atkinson-hyperlegible-next/700.css" />
    <link rel="stylesheet" href="/node_modules/@fontsource/atkinson-hyperlegible-mono/700.css" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <style>
      /*
       * "Bath time" mockups: bubble sort's bars drawn as ducks, four styles.
       * Query: ?opt=1|2|3|4 &view=desktop|phone|states &theme=light|dark &n=6|12
       * Ducks are never yellow (yellow means "comparing"); roles show as ripples, rings and
       * splashes on the water, always with a word label under the duck.
       * Mockup-only colors (water, pad, log, duck) would become tokens if one is picked.
       */
      :root {
        --duck: #fffaf0;
        --duck-shade: #e6d8bd;
        --duck-line: #15171c;
        --beak: #ff8a1f;
        --water: #2e8bff;
        --water-light: #8cc4ff;
        --pad: #2f6b3a;
        --log: #8c5a2b;
        --log-light: #b07a45;
        --sky: var(--color-stage);
      }
      :root[data-theme='dark'] {
        --water: #1f6fd6;
        --water-light: #4f97f0;
        --pad: #3d8a4b;
        --sky: var(--color-stage);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--color-bg);
        color: var(--color-ink);
        font-family: var(--font-text);
      }

      /* ---------- Shells ---------- */
      .desk {
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100vh;
      }
      .band {
        display: flex;
        align-items: baseline;
        gap: 16px;
        padding: 14px 24px;
        background: var(--cat-sorting);
        color: var(--cat-on-sorting);
        border-bottom: 4px solid var(--color-line);
      }
      .band h1 {
        margin: 0;
        font-family: var(--font-display);
        font-stretch: var(--display-stretch);
        font-weight: var(--display-weight);
        font-size: 34px;
        line-height: 1;
      }
      .band span {
        font-weight: 700;
      }
      .explain {
        padding: 10px 24px;
        background: var(--role-comparing);
        color: var(--role-on-comparing);
        border-top: 4px solid var(--color-line);
        font-weight: 700;
        font-size: 20px;
      }
      .explain small {
        display: block;
        font-size: 13px;
      }
      .phone {
        display: grid;
        grid-template-rows: 48px auto 1fr auto auto auto;
        height: 100vh;
      }
      .hdr {
        display: flex;
        border-bottom: 4px solid var(--color-line);
      }
      .hdr b {
        display: flex;
        align-items: center;
        padding: 0 14px;
        background: var(--color-ink);
        color: var(--color-bg);
        font-family: var(--font-display);
        font-stretch: var(--display-stretch);
        font-weight: 850;
      }
      .hdr span {
        display: flex;
        align-items: center;
        padding: 0 12px;
        font-weight: 700;
        font-size: 14px;
        border-right: 3px solid var(--color-line);
      }
      .hdr i {
        margin-left: auto;
        display: flex;
        align-items: center;
        padding: 0 14px;
        font-style: normal;
        font-weight: 700;
        font-size: 14px;
      }
      .phone .band {
        padding: 8px 14px 10px;
      }
      .phone .band h1 {
        font-size: 22px;
      }
      .phone .explain {
        padding: 8px 14px;
        font-size: 16px;
      }
      .pills {
        display: flex;
        gap: 6px;
        padding: 8px 12px;
        border-top: 4px solid var(--color-line);
        border-bottom: 4px solid var(--color-line);
      }
      .pills span {
        flex: 1;
        display: grid;
        place-items: center;
        min-height: 44px;
        border: 3px solid var(--color-line);
        font-weight: 700;
        font-size: 14px;
      }
      .ctl {
        display: grid;
        grid-template-columns: 1fr 1.4fr 1fr 64px;
      }
      .ctl span {
        display: grid;
        place-items: center;
        min-height: 60px;
        border-right: 4px solid var(--color-line);
        font-weight: 700;
        font-size: 14px;
      }
      .ctl span:nth-child(2) {
        background: var(--cat-sorting);
        color: var(--cat-on-sorting);
      }
      .ctl span:last-child {
        border-right: 0;
        font-family: var(--font-mono);
      }
      .stage {
        position: relative;
        min-height: 0;
        overflow: hidden;
      }
      .stage svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .states {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        height: 100vh;
        border-top: 4px solid var(--color-line);
      }
      .states > div {
        display: grid;
        grid-template-rows: 1fr auto;
        border-right: 4px solid var(--color-line);
      }
      .states > div:last-child {
        border-right: 0;
      }
      .states h2 {
        margin: 0;
        padding: 8px 12px;
        font-size: 16px;
        border-top: 4px solid var(--color-line);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const q = new URLSearchParams(location.search)
      const opt = Number(q.get('opt') ?? 1)
      const view = q.get('view') ?? 'desktop'
      const n = Number(q.get('n') ?? 6)
      document.documentElement.dataset.theme = q.get('theme') ?? 'light'
      document.documentElement.dataset.level = 'explorer'
      const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim()

      // Mid-run, mid-swap: the 3 and the 8 trade places (the 8 hops), the 9 is done.
      const SIX = {
        values: [2, 1, 5, 8, 3, 9],
        swap: [3, 4],
        done: [5],
        ptr: { 3: 'left', 4: 'right' },
      }
      const TWELVE = {
        values: [12, 45, 7, 23, 61, 3, 0, 50, 34, 18, 88, 95],
        swap: [7, 8],
        done: [10, 11],
        ptr: { 7: 'left', 8: 'right' },
      }
      const DATA = n === 12 ? TWELVE : SIX
      const P = 0.45 // how far through the hop

      // ---------- Pixel art ----------
      // A 16×14 bath duck facing right: o outline, b body, s shade, k beak, e eye.
      const DUCK = [
        '.......oooo.....',
        '......obbbbo....',
        '.....obbbbbbo...',
        '.....obbbebbokk.',
        '.....obbbbbbokkk',
        '......obbbbbo...',
        '.......obbbo....',
        'oo....obbbbbo...',
        'obo..obbbbbbbo..',
        'obbooobbbbbbbbo.',
        'obbbbbbssssbbbo.',
        '.obbbbbbsssbbbo.',
        '..obbbbbbbbbbo..',
        '...ooooooooooo..',
      ]
      // 3×5 digits for the arcade style.
      const DIGITS = {
        0: ['111', '101', '101', '101', '111'],
        1: ['010', '110', '010', '010', '111'],
        2: ['111', '001', '111', '100', '111'],
        3: ['111', '001', '111', '001', '111'],
        4: ['101', '101', '111', '001', '001'],
        5: ['111', '100', '111', '001', '111'],
        6: ['111', '100', '111', '101', '111'],
        7: ['111', '001', '010', '010', '010'],
        8: ['111', '101', '111', '101', '111'],
        9: ['111', '101', '111', '001', '111'],
      }
      const pixelDuck = (x, y, px) => {
        const fill = {
          o: css('--duck-line'),
          b: css('--duck'),
          s: css('--duck-shade'),
          k: css('--beak'),
          e: css('--duck-line'),
        }
        let out = ''
        DUCK.forEach((row, r) =>
          [...row].forEach((c, k) => {
            if (c !== '.')
              out += `<rect x="${x + k * px}" y="${y + r * px}" width="${px + 0.5}" height="${px + 0.5}" fill="${fill[c]}"/>`
          }),
        )
        return out
      }
      const pixelNumber = (value, cx, y, px, color) => {
        const s = String(value)
        const w = s.length * 4 * px - px
        let out = '',
          x0 = cx - w / 2
        ;[...s].forEach((d, i) =>
          DIGITS[d].forEach((row, r) =>
            [...row].forEach((c, k) => {
              if (c === '1')
                out += `<rect x="${x0 + i * 4 * px + k * px}" y="${y + r * px}" width="${px}" height="${px}" fill="${color}"/>`
            }),
          ),
        )
        return out
      }
      // Smooth flat duck: body, head, beak, eye, wing. (cx, base) is the waterline under it.
      const flatDuck = (cx, base, size) => {
        const s = size,
          line = css('--duck-line')
        return `<g stroke="${line}" stroke-width="${Math.max(2, s * 0.05)}" stroke-linejoin="round">
          <path d="M${cx - s * 0.55} ${base - s * 0.35} Q${cx - s * 0.6} ${base} ${cx - s * 0.05} ${base} L${cx + s * 0.4} ${base} Q${cx + s * 0.62} ${base - s * 0.05} ${cx + s * 0.55} ${base - s * 0.32} Q${cx + s * 0.2} ${base - s * 0.5} ${cx - s * 0.2} ${base - s * 0.42} Q${cx - s * 0.45} ${base - s * 0.55} ${cx - s * 0.55} ${base - s * 0.35} Z" fill="${css('--duck')}"/>
          <circle cx="${cx + s * 0.12}" cy="${base - s * 0.62}" r="${s * 0.24}" fill="${css('--duck')}"/>
          <path d="M${cx + s * 0.32} ${base - s * 0.66} L${cx + s * 0.56} ${base - s * 0.6} L${cx + s * 0.32} ${base - s * 0.52} Z" fill="${css('--beak')}"/>
        </g>
        <circle cx="${cx + s * 0.18}" cy="${base - s * 0.67}" r="${Math.max(1.5, s * 0.04)}" fill="${line}"/>
        <path d="M${cx - s * 0.22} ${base - s * 0.22} Q${cx} ${base - s * 0.05} ${cx + s * 0.18} ${base - s * 0.22}" fill="none" stroke="${line}" stroke-width="${Math.max(2, s * 0.04)}" stroke-linecap="round"/>`
      }

      // ---------- Role marks on the water ----------
      const ripples = (cx, y, w, color, rings = 2) => {
        let out = ''
        for (let i = 0; i < rings; i++)
          out += `<ellipse cx="${cx}" cy="${y}" rx="${w * (0.5 + i * 0.16)}" ry="${w * (0.11 + i * 0.04)}" fill="none" stroke="${color}" stroke-width="${i === 0 ? 4 : 3}"/>`
        return out
      }
      const splash = (cx, y, w, color, pixel) => {
        let out = ripples(cx, y, w * 0.9, color, 2)
        const drops = [
          [-0.45, -0.5],
          [-0.3, -0.85],
          [-0.1, -0.6],
          [0.15, -0.9],
          [0.32, -0.55],
          [0.48, -0.75],
        ]
        drops.forEach(([dx, dy]) => {
          const x = cx + dx * w,
            yy = y + dy * w * 0.45,
            r = w * 0.045
          out += pixel
            ? `<rect x="${x - r}" y="${yy - r}" width="${2 * r}" height="${2 * r}" fill="${color}" stroke="${css('--duck-line')}" stroke-width="1.5"/>`
            : `<circle cx="${x}" cy="${yy}" r="${r}" fill="${color}" stroke="${css('--duck-line')}" stroke-width="1.5"/>`
        })
        return out
      }
      const arc = (x1, x2, y, lift, color) =>
        `<path d="M${x1} ${y} Q${(x1 + x2) / 2} ${y - lift * 2} ${x2} ${y}" fill="none" stroke="${color}" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>`

      // ---------- Labels under each duck (color is never the only signal) ----------
      const tag = (cx, y, text, bg, fg, size) => {
        const w = text.length * size * 0.58 + size
        return `<rect x="${cx - w / 2}" y="${y}" width="${w}" height="${size * 1.45}" fill="${bg}"/><text x="${cx}" y="${y + size * 1.08}" text-anchor="middle" font-family="Atkinson Hyperlegible Next" font-weight="700" font-size="${size}" fill="${fg}">${text}</text>`
      }

      // ---------- The stage ----------
      function stageSvg(W, H, data, opts = {}) {
        const { values, swap, done, ptr } = data
        const cmp = opts.cmp ?? []
        const n = values.length,
          colW = W / n,
          labelH = n > 8 ? 46 : 58
        const base = H - labelH,
          top = 16,
          max = Math.max(...values, 1)
        const small = n > 8
        const textSize = small ? 11 : 14
        let back = '',
          front = '',
          labels = ''
        const xOf = (i) => {
          let x = (i + 0.5) * colW
          if (opts.mid !== false && swap.includes(i)) x += (i === swap[0] ? 1 : -1) * P * colW
          return x
        }
        const lifted = (i) => opts.mid !== false && i === swap[0] // the bigger one, moving right, hops
        const role = (i) =>
          swap.includes(i) ? 'swap' : done.includes(i) ? 'done' : cmp.includes(i) ? 'cmp' : null
        const roleColor = {
          swap: css('--role-swapping'),
          done: css('--role-sorted'),
          cmp: css('--role-comparing'),
        }

        // Background: sky/stage, and the river along the bottom for the duck-only styles.
        back += `<rect width="${W}" height="${H}" fill="${css('--sky')}"/>`
        if (opt === 2 || opt === 3) {
          back += `<rect x="0" y="${base - 16}" width="${W}" height="16" fill="${css('--water')}"/><rect x="0" y="${base - 16}" width="${W}" height="4" fill="${css('--water-light')}"/>`
        }
        if (opt === 4) {
          // Pixel river: stripes of chunky waves behind everything.
          const t = 8
          for (let y = top + 10; y < base; y += t * 3) {
            for (let x = 0; x < W; x += t * 4)
              back += `<rect x="${x + ((y / t) % 2) * t * 2}" y="${y}" width="${t * 2}" height="${t}" fill="${css('--water-light')}" opacity="0.35"/>`
          }
        }
        if (opt === 4) {
          back =
            `<rect width="${W}" height="${H}" fill="${css('--water')}"/>` +
            back.replace(/<rect width="[^"]*" height="[^"]*" fill="[^"]*"\/>/, '')
          const hud =
            opts.hud === false
              ? ''
              : `<rect x="12" y="10" width="${small ? 150 : 210}" height="${small ? 26 : 34}" fill="${css('--duck-line')}" stroke="${css('--duck')}" stroke-width="2"/>`
          if (opts.hud !== false)
            front +=
              hud +
              pixelNumber(
                String(opts.cmpCount ?? 9).padStart(2, '0'),
                small ? 50 : 66,
                small ? 17 : 19,
                small ? 2 : 3,
                css('--role-comparing'),
              ) +
              pixelNumber(
                String(opts.swapCount ?? 5).padStart(2, '0'),
                small ? 120 : 172,
                small ? 17 : 19,
                small ? 2 : 3,
                css('--role-swapping'),
              )
          if (opts.hud !== false)
            front += `<text x="${small ? 18 : 20}" y="${small ? 28 : 33}" font-family="Atkinson Hyperlegible Mono" font-weight="700" font-size="${small ? 9 : 12}" fill="${css('--duck')}">CMP</text><text x="${small ? 85 : 120}" y="${small ? 28 : 33}" font-family="Atkinson Hyperlegible Mono" font-weight="700" font-size="${small ? 9 : 12}" fill="${css('--duck')}">SWP</text>`
        }
        back += `<rect x="0" y="${base}" width="${W}" height="4" fill="${css('--color-line')}"/>`

        values.forEach((v, i) => {
          const cx = xOf(i),
            r = role(i),
            lift = lifted(i) ? (opt === 1 || opt === 4 ? 26 : colW * 0.55) : 0
          const color = r ? roleColor[r] : null
          const colInner = colW * 0.78
          if (opt === 1 || opt === 4) {
            // A column of water whose height is the value, with a pad (1) or a log (4) on top.
            const h = Math.max(6, ((base - top - colW * 0.9) * v) / max)
            const yTop = base - h
            const fill = opt === 4 ? css('--water') : css('--water')
            const col =
              opt === 4
                ? (() => {
                    // A depth pole, striped every 12px like a river gauge.
                    const pw = Math.max(6, colW * 0.07)
                    let s = `<rect x="${cx - pw / 2}" y="${yTop}" width="${pw}" height="${h}" fill="${css('--duck')}" stroke="${css('--color-line')}" stroke-width="2"/>`
                    for (let y = base - 12; y > yTop; y -= 24)
                      s += `<rect x="${cx - pw / 2}" y="${Math.max(yTop, y - 12)}" width="${pw}" height="${Math.min(12, y - yTop)}" fill="${css('--cat-sorting')}"/>`
                    return s
                  })()
                : `<rect x="${cx - colInner / 2}" y="${yTop}" width="${colInner}" height="${h}" fill="${fill}" stroke="${css('--color-line')}" stroke-width="3"/><rect x="${cx - colInner / 2 + 3}" y="${yTop + 3}" width="${colInner - 6}" height="4" fill="${css('--water-light')}"/>`
            const padY = yTop
            const logH = small ? 20 : 30
            const pad =
              opt === 4
                ? `<rect x="${cx - colInner * 0.5}" y="${padY - logH / 2}" width="${colInner}" height="${logH}" fill="${css('--log')}" stroke="${css('--color-line')}" stroke-width="3"/><rect x="${cx - colInner * 0.5 + 4}" y="${padY - logH / 2 + 4}" width="${colInner - 8}" height="3" fill="${css('--log-light')}"/>` +
                  pixelNumber(v, cx, padY - (small ? 5 : 10), small ? 2 : 4, css('--duck'))
                : `<ellipse cx="${cx}" cy="${padY}" rx="${colInner * 0.55}" ry="${Math.max(5, colW * 0.07)}" fill="${css('--pad')}" stroke="${css('--color-line')}" stroke-width="2.5"/>`
            const px = Math.max(1.5, (colW * 0.62) / 16)
            // Only the duck hops; its column stays on the riverbed and slides across.
            const duckLift = lifted(i) ? colW * 0.5 : 0
            const duck = pixelDuck(
              cx - 8 * px,
              padY - 14 * px - (opt === 4 ? logH / 2 : 3) - duckLift,
              px,
            )
            // Ripples or splash at the top of the water.
            // Logs get a thick outline in the role color; pads get rings on the water.
            const ring = (c) =>
              opt === 4
                ? `<rect x="${cx - colInner * 0.5 - 6}" y="${padY - logH / 2 - 6}" width="${colInner + 12}" height="${logH + 12}" fill="none" stroke="${c}" stroke-width="5"/>`
                : ripples(cx, padY, colInner * 0.62, c)
            const mark =
              r === 'swap'
                ? lifted(i)
                  ? ring(color) +
                    splash(cx, padY - (opt === 4 ? logH : 0), colInner * 0.62, color, true).replace(
                      /<ellipse[^>]*\/>/g,
                      opt === 4 ? '' : '$&',
                    )
                  : ring(color)
                : color
                  ? ring(color)
                  : ''
            // The number sits low in the column, clear of the pad and the ripples.
            const num =
              opt === 4
                ? ''
                : `<text x="${cx}" y="${Math.min(base - (small ? 6 : 8), yTop + (small ? 28 : 40))}" text-anchor="middle" font-family="Atkinson Hyperlegible Mono" font-weight="700" font-size="${small ? 13 : 20}" fill="${css('--color-on-deep')}">${v}</text>`
            const body = col + num + pad + mark
            // The left-mover slides in front; the right-mover's duck is in the air above both.
            if (lifted(i)) {
              back += body
              front +=
                arc(cx - colW * P, cx + colW * (1 - P), padY - 14 * px * 0.5, colW * 0.45, color) +
                duck
            } else if (opts.mid !== false && i === swap[1]) front = body + duck + front
            else back += body + duck
          } else {
            // Duck-only styles: the duck is the value. The waterline is just above the riverbed.
            const water = base - 16
            let size
            if (opt === 2) {
              const steps = [0.42, 0.58, 0.74, 0.9]
              size = colW * steps[Math.min(3, Math.floor((v / (max + 1)) * 4))]
            } else {
              size = Math.max(colW * 0.14, colW * 0.7 * (v / max))
            }
            const hop = lifted(i) ? Math.max(size * 0.75, 40) : 0
            const y = water - hop
            let duck
            if (opt === 2) {
              const px = size / 16
              const topY = y - 12 * px // bottom two rows sit below the waterline
              duck = pixelDuck(cx - 8 * px, topY, px)
              // Number on the belly: the pale patch at rows 10–12, columns 6–12.
              const fs = Math.max(10, Math.min(px * 3.4, small ? 13 : 26))
              duck += `<text x="${cx - 8 * px + 9.5 * px}" y="${topY + 11.7 * px + fs * 0.35}" text-anchor="middle" font-family="Atkinson Hyperlegible Mono" font-weight="700" font-size="${fs}" fill="${css('--duck-line')}">${v}</text>`
            } else {
              duck = flatDuck(cx, y + size * 0.12, size)
              const inside = size > colW * 0.45
              duck += inside
                ? `<text x="${cx - size * 0.12}" y="${y + size * 0.12 - size * 0.27}" text-anchor="middle" font-family="Atkinson Hyperlegible Mono" font-weight="700" font-size="${Math.min(size * 0.22, small ? 13 : 24)}" fill="${css('--duck-line')}">${v}</text>`
                : `<text x="${cx}" y="${y - size * 0.9 - 6}" text-anchor="middle" font-family="Atkinson Hyperlegible Mono" font-weight="700" font-size="${small ? 12 : 18}" fill="${css('--color-ink')}">${v}</text>`
            }
            // Rings sit on the water around the duck, wider than it so they always show.
            const ringW = size * 1.05
            const mark =
              r === 'swap'
                ? lifted(i)
                  ? splash(cx - colW * P * 0.7, water, Math.max(ringW * 0.8, 50), color, opt === 2)
                  : ripples(cx, water, ringW, color)
                : color
                  ? ripples(cx, water, ringW, color)
                  : ''
            if (lifted(i))
              front +=
                mark +
                arc(
                  cx - colW * P,
                  cx + colW * (1 - P),
                  water - 4,
                  Math.max(size * 0.6, 40),
                  color,
                ) +
                duck
            else if (opts.mid !== false && i === swap[1]) front = mark + duck + front
            else back += mark + duck
          }
          // Labels under the waterline: pointer word, then the role word.
          let ly = base + 8
          const lx = (i + 0.5) * colW + (swap.includes(i) && opts.mid !== false ? 0 : 0)
          if (ptr[i]) {
            labels += tag(lx, ly, ptr[i], css('--color-ink'), css('--color-bg'), textSize)
            ly += textSize * 1.6
          }
          // With 9+ ducks the words don't fit under each one: symbols, explained in the Colors sheet.
          if (r)
            labels += tag(
              lx,
              ly,
              (small
                ? { swap: '⇄', done: '✓', cmp: '?' }
                : { swap: 'trading', done: 'done ✓', cmp: 'looking' })[r],
              roleColor[r],
              css(
                {
                  swap: '--role-on-swapping',
                  done: '--role-on-sorted',
                  cmp: '--role-on-comparing',
                }[r],
              ),
              textSize,
            )
        })
        return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${back}${front}${labels}</svg>`
      }

      const root = document.getElementById('root')
      const STYLE = {
        1: 'Ducks on lily pads',
        2: 'Pixel ducks, size steps',
        3: 'Smooth ducks, exact sizes',
        4: 'Arcade river',
      }[opt]
      if (view === 'states') {
        // One duck per state, side by side: at rest, comparing, trading (mid-hop), done.
        const cells = [
          ['At rest', { values: [5, 5], swap: [], done: [], ptr: {} }, {}],
          [
            'Comparing',
            { values: [5, 5], swap: [], done: [], ptr: { 0: 'left', 1: 'right' } },
            { cmp: [0, 1] },
          ],
          [
            'Trading places (mid-hop)',
            { values: [6, 3], swap: [0, 1], done: [], ptr: { 0: 'left', 1: 'right' } },
            {},
          ],
          ['Done', { values: [4, 6], swap: [], done: [0, 1], ptr: {} }, {}],
        ]
        root.innerHTML = `<div class="states">${cells.map(([t]) => `<div><div class="stage"></div><h2>${t}</h2></div>`).join('')}</div>`
        document.querySelectorAll('.states .stage').forEach((el, k) => {
          const [, data, o] = cells[k]
          el.innerHTML = stageSvg(el.clientWidth, el.clientHeight, data, { ...o, hud: false })
        })
      } else if (view === 'phone') {
        root.innerHTML = `<div class="phone"><div class="hdr"><b>Stepwise</b><span>Topics</span><i>☰ Menu</i></div>
          <div class="band"><h1>Bubble the biggest to the end</h1></div>
          <div class="stage"></div>
          <div class="explain"><small>What’s happening</small>Yes! ${DATA.values[DATA.swap[0]]} is bigger, so they trade places.</div>
          <div class="pills"><span>The idea</span><span>Numbers</span><span>So far</span><span>Colors</span></div>
          <div class="ctl"><span>Back</span><span>Play</span><span>Step</span><span>1×</span></div></div>`
        const el = document.querySelector('.stage')
        el.innerHTML = stageSvg(el.clientWidth, el.clientHeight, DATA)
      } else {
        root.innerHTML = `<div class="desk"><div class="band"><h1>Bubble the biggest to the end</h1><span>${STYLE}</span></div><div class="stage"></div>
          <div class="explain"><small>What’s happening</small>Yes! ${DATA.values[DATA.swap[0]]} is bigger, so they trade places.</div></div>`
        const el = document.querySelector('.stage')
        el.innerHTML = stageSvg(el.clientWidth, el.clientHeight, DATA)
      }
    </script>
  </body>
</html>
