<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Phone layout options</title>
    <link rel="stylesheet" href="/node_modules/@fontsource-variable/archivo/wdth.css" />
    <link rel="stylesheet" href="/node_modules/@fontsource/atkinson-hyperlegible-next/400.css" />
    <link rel="stylesheet" href="/node_modules/@fontsource/atkinson-hyperlegible-next/700.css" />
    <link rel="stylesheet" href="/node_modules/@fontsource/atkinson-hyperlegible-mono/400.css" />
    <link rel="stylesheet" href="/node_modules/@fontsource/atkinson-hyperlegible-mono/700.css" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <style>
      /*
       * Phone layout mockups for the workspace (design D tokens). Two options:
       *   A "Split": stage + caption always; one detail panel always open below, picked by tabs.
       *   B "Focus": stage + caption fill the screen; a detail opens as a sheet that shrinks the
       *     bars to a mini strip (portrait) or a side panel (landscape). Bars never disappear.
       * Everything lives in 100dvh with safe-area padding; the page itself never scrolls.
       */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--color-bg);
        color: var(--color-ink);
        font-family: var(--font-text);
        font-size: var(--text-base);
      }
      button {
        font: inherit;
        color: inherit;
      }
      .app {
        display: flex;
        flex-direction: column;
        height: 100dvh;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
        overflow: hidden;
      }

      /* ---------- Header: one 48px row ---------- */
      .hdr {
        display: flex;
        align-items: stretch;
        min-height: 48px;
        border-bottom: var(--border-thick) solid var(--color-line);
        flex: none;
      }
      .wordmark {
        display: flex;
        align-items: center;
        padding: 0 14px;
        background: var(--color-ink);
        color: var(--color-bg);
        font-family: var(--font-display);
        font-stretch: var(--display-stretch);
        font-weight: 850;
        font-size: 1.125rem;
      }
      .hdr .topics {
        display: flex;
        align-items: center;
        padding: 0 12px;
        border-right: var(--border) solid var(--color-line);
        font-weight: 700;
        font-size: var(--text-sm);
      }
      .hdr .spacer {
        flex: 1;
      }
      .hdr .menu {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 48px;
        padding: 0 14px;
        border: 0;
        background: transparent;
        font-weight: 700;
        font-size: var(--text-sm);
      }
      .burger {
        display: inline-grid;
        gap: 4px;
      }
      .burger i {
        display: block;
        width: 18px;
        height: 3px;
        background: currentColor;
      }
      .hdr .h-title {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        min-width: 0;
        background: var(--cat-sorting);
        color: var(--cat-on-sorting);
        font-family: var(--font-display);
        font-stretch: var(--display-stretch);
        font-weight: 850;
        font-size: 1rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1 1 auto;
      }

      /* ---------- Band ---------- */
      .band {
        flex: none;
        padding: 10px 14px 12px;
        background: var(--cat-sorting);
        color: var(--cat-on-sorting);
        border-bottom: var(--border-thick) solid var(--color-line);
        display: grid;
        gap: 8px;
      }
      .band h1 {
        margin: 0;
        font-family: var(--font-display);
        font-stretch: var(--display-stretch);
        font-weight: var(--display-weight);
        font-size: 1.375rem;
        line-height: 1.05;
      }
      .band .sub {
        font-weight: 700;
        font-size: var(--text-sm);
        margin-top: 2px;
      }
      .titlerow {
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }
      .titlerow > div {
        flex: 1;
        min-width: 0;
      }
      .fieldbtn,
      .ideabtn,
      .chip,
      .run,
      .field {
        min-height: 44px;
        border: var(--border) solid var(--color-on-field);
        background: var(--color-field);
        color: var(--color-on-field);
        font-weight: 700;
      }
      .ideabtn {
        padding: 0 12px;
        flex: none;
        font-size: var(--text-sm);
      }
      .numrow {
        display: flex;
        gap: 8px;
      }
      .field {
        flex: 1;
        min-width: 0;
        padding: 0 10px;
        font-family: var(--font-mono);
        font-size: var(--text-md);
        display: flex;
        align-items: center;
      }
      .run {
        padding: 0 16px;
        background: var(--color-on-field);
        color: var(--color-field);
      }
      .chips {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        margin: 0 -14px;
        padding: 0 14px;
        scrollbar-width: none;
      }
      .chip {
        flex: none;
        padding: 0 12px;
        font-size: var(--text-sm);
      }
      .fieldbtn {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 10px;
        width: 100%;
      }
      .fieldbtn .nums {
        font-family: var(--font-mono);
        font-size: var(--text-md);
        flex: 1;
        text-align: left;
      }
      .fieldbtn .edit {
        font-size: var(--text-sm);
        text-decoration: underline;
      }

      /* ---------- Stage ---------- */
      .stage {
        position: relative;
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 8px 12px 0;
        background-color: var(--color-stage);
        background-image:
          linear-gradient(var(--color-stage-grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--color-stage-grid) 1px, transparent 1px);
        background-size: 20px 20px;
      }
      .cap {
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        color: var(--color-muted);
        min-height: 1.2em;
      }
      .bars {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: repeat(var(--n), 1fr);
        gap: 8px;
        align-items: end;
        border-bottom: var(--border-thick) solid var(--color-line);
      }
      .bar {
        height: calc(1.9rem + (100% - 1.9rem) * var(--h));
        display: grid;
        place-items: start center;
        padding-top: 4px;
        background: var(--color-bar);
        color: var(--color-on-bar);
        font-family: var(--font-mono);
        font-weight: 700;
        font-size: var(--bar-font, 1.25rem);
      }
      .bar.swapping {
        background: var(--role-swapping);
        color: var(--role-on-swapping);
        outline: var(--border) solid var(--color-line);
        outline-offset: calc(-1 * var(--border));
      }
      .bar.sorted {
        background: var(--role-sorted);
        color: var(--role-on-sorted);
      }
      .marks {
        display: grid;
        grid-template-columns: repeat(var(--n), 1fr);
        gap: 8px;
        min-height: 40px;
        padding-top: 4px;
      }
      .mark {
        display: grid;
        justify-items: center;
        gap: 2px;
        font-size: 11px;
        font-weight: 700;
      }
      .mark .ptr {
        padding: 1px 5px;
        background: var(--color-ink);
        color: var(--color-bg);
      }
      .mark .role {
        padding: 0 4px;
        background: var(--role-swapping);
        color: var(--role-on-swapping);
      }
      .mark .role.sorted {
        background: var(--role-sorted);
        color: var(--role-on-sorted);
      }
      .mark .idx {
        font-family: var(--font-mono);
        color: var(--color-muted);
      }
      .mini .bars {
        gap: 4px;
      }
      .mini .bar {
        --bar-font: 0.875rem;
        height: calc(1.2rem + (100% - 1.2rem) * var(--h));
        padding-top: 1px;
      }
      .mini .marks,
      .mini .cap {
        display: none;
      }

      /* ---------- Caption: "What's happening", always visible ---------- */
      .explain {
        flex: none;
        padding: 8px 14px;
        border-top: var(--border-thick) solid var(--color-line);
        border-bottom: var(--border-thick) solid var(--color-line);
        box-shadow: inset 6px 0 0 var(--cat-sorting);
      }
      [data-level='explorer'] .explain {
        background: var(--role-comparing);
        color: var(--role-on-comparing);
        box-shadow: none;
      }
      .explain h2 {
        margin: 0;
        font-size: var(--text-xs);
        font-weight: 700;
        display: flex;
        justify-content: space-between;
      }
      .explain p {
        margin: 2px 0 0;
        font-size: var(--text-md);
        font-weight: 700;
        line-height: 1.3;
      }
      [data-level='engineer'] .explain p {
        font-weight: 400;
      }
      .statsinline {
        font-family: var(--font-mono);
        font-weight: 700;
      }

      /* ---------- Tabs and panel ---------- */
      .tabs {
        flex: none;
        display: flex;
        border-bottom: var(--border-thick) solid var(--color-line);
      }
      .tab {
        flex: 1;
        min-height: 44px;
        border: 0;
        border-right: var(--border-thin) solid var(--color-line);
        background: transparent;
        font-weight: 700;
        font-size: var(--text-sm);
        color: var(--color-muted);
      }
      .tab:last-child {
        border-right: 0;
      }
      .tab[aria-selected='true'] {
        background: var(--color-selected);
        color: var(--color-on-selected);
      }
      .tab[aria-selected='true']::before {
        content: '✓ ';
      }
      .panel {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 10px 14px;
      }
      .panel h3 {
        margin: 0 0 4px;
        font-family: var(--font-display);
        font-stretch: var(--display-stretch);
        font-weight: var(--display-weight);
        font-size: var(--text-lg);
      }
      .lead {
        margin: 0 0 6px;
        font-weight: 700;
      }
      .pt {
        padding: 6px 0;
        border-top: var(--border-thin) dashed var(--color-line);
      }
      .pt b {
        display: block;
        font-size: var(--text-sm);
      }
      .pt span {
        font-size: var(--text-sm);
        line-height: 1.35;
      }
      .idea-go {
        position: sticky;
        bottom: -10px;
        padding: 8px 0 10px;
        background: var(--color-bg);
        border-top: var(--border-thin) dashed var(--color-line);
      }
      .idea-go button {
        min-height: 44px;
        padding: 0 18px;
        border: var(--border-thick) solid var(--color-line);
        background: var(--color-selected);
        color: var(--color-on-selected);
        font-weight: 700;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        border: var(--border-thin) solid var(--color-line);
      }
      th,
      td {
        padding: 3px 4px;
        text-align: center;
        border-top: 1px solid var(--color-rule);
      }
      th {
        border-bottom: var(--border-thin) solid var(--color-line);
      }
      td + td,
      th + th {
        border-left: 1.5px solid var(--color-line);
      }
      tr.grp td {
        border-top: var(--border-thin) dashed var(--color-line);
      }
      tr.cur td {
        background: var(--role-comparing);
        color: var(--role-on-comparing);
        font-weight: 700;
      }
      td.yes span {
        padding: 0 4px;
        background: var(--role-swapping);
        color: var(--role-on-swapping);
        font-weight: 700;
      }
      .code {
        font-family: var(--font-mono);
        font-size: 12.5px;
        line-height: 1.55;
        white-space: pre;
      }
      .code .ln {
        color: var(--color-muted);
        display: inline-block;
        width: 2.1em;
      }
      .code .act {
        background: var(--role-comparing);
        color: var(--role-on-comparing);
        font-weight: 700;
      }
      .key {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
        font-weight: 700;
      }
      .key li {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .sw {
        width: 22px;
        height: 22px;
        border: var(--border-thin) solid var(--color-line);
      }

      /* ---------- Controls: fixed at the bottom, in thumb reach ---------- */
      .ctrls {
        flex: none;
        border-top: var(--border-thick) solid var(--color-line);
        padding-bottom: env(safe-area-inset-bottom);
      }
      .prog {
        position: relative;
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding: 0 12px;
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        font-weight: 700;
        color: var(--color-muted);
        border-bottom: var(--border-thin) solid var(--color-line);
      }
      .prog i {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: var(--p);
        background: var(--color-surface);
        border-right: var(--border-thin) solid var(--color-line);
      }
      .prog span {
        position: relative;
      }
      .btns {
        display: grid;
        grid-template-columns: 1fr 1.4fr 1fr 64px;
      }
      .cbtn {
        min-height: 60px;
        border: 0;
        border-right: var(--border-thick) solid var(--color-line);
        background: var(--color-bg);
        font-weight: 700;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 2px;
        font-size: var(--text-sm);
      }
      .cbtn:last-child {
        border-right: 0;
      }
      .cbtn svg {
        width: 20px;
        height: 20px;
      }
      .cbtn.play {
        background: var(--cat-sorting);
        color: var(--cat-on-sorting);
      }
      .cbtn.speed {
        font-family: var(--font-mono);
        font-size: var(--text-md);
      }
      .home-ind {
        height: 0;
      }

      /* ---------- Option B: chips row and sheet ---------- */
      .pills {
        flex: none;
        display: flex;
        gap: 8px;
        padding: 8px 12px;
        overflow-x: auto;
        border-bottom: var(--border-thin) solid var(--color-line);
        scrollbar-width: none;
      }
      .pill {
        flex: none;
        min-height: 44px;
        padding: 0 14px;
        border: var(--border) solid var(--color-line);
        background: var(--color-bg);
        font-weight: 700;
        font-size: var(--text-sm);
      }
      .pill[aria-expanded='true'] {
        background: var(--color-selected);
        color: var(--color-on-selected);
      }
      .pill[aria-expanded='true']::before {
        content: '✓ ';
      }
      .sheethead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 14px;
        border-bottom: var(--border-thin) solid var(--color-line);
        font-weight: 700;
        font-size: var(--text-sm);
      }
      .sheethead button {
        min-height: 44px;
        min-width: 44px;
        border: var(--border) solid var(--color-line);
        background: var(--color-bg);
        font-weight: 700;
        padding: 0 12px;
      }

      /* ---------- Landscape ---------- */
      .land .main {
        flex: 1;
        min-height: 0;
        display: grid;
      }
      .land.A .main {
        grid-template-columns: 1fr 44%;
      }
      .land.B .main {
        grid-template-columns: 1fr 76px;
      }
      .land.B.open .main {
        grid-template-columns: 1fr 42% 76px;
      }
      .land .left {
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
        border-right: var(--border-thick) solid var(--color-line);
      }
      .land .right {
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
      }
      .land .explain {
        border-top: var(--border-thick) solid var(--color-line);
        border-bottom: 0;
        padding: 6px 12px;
      }
      .land .explain p {
        font-size: var(--text-base);
      }
      .land .marks {
        min-height: 34px;
      }
      .vctrls {
        display: grid;
        grid-template-rows: 1fr 1.3fr 1fr 44px;
        border-left: var(--border-thick) solid var(--color-line);
        padding-right: env(safe-area-inset-right);
      }
      .vctrls .cbtn {
        border-right: 0;
        border-bottom: var(--border-thick) solid var(--color-line);
        min-height: 0;
      }
      .vctrls .cbtn:last-child {
        border-bottom: 0;
      }
      .land .ctrls .btns {
        grid-template-columns: 1fr 1.4fr 1fr 64px;
      }
      .land .cbtn {
        min-height: 48px;
      }
      .land .prog {
        height: 18px;
      }
      .hchip {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 10px;
        border: 0;
        border-left: var(--border) solid var(--color-line);
        background: transparent;
        font-weight: 700;
        font-size: var(--text-sm);
      }
      .hchip .nums {
        font-family: var(--font-mono);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const q = new URLSearchParams(location.search)
      const opt = q.get('opt') ?? 'A'
      const lvl = q.get('lvl') ?? 'explorer'
      const theme = q.get('theme') ?? 'light'
      const step = Number(q.get('step') ?? 1)
      const land = innerWidth > innerHeight
      const open = q.get('open') ?? (step === 1 ? 'idea' : opt === 'A' ? 'trace' : 'none')
      document.documentElement.dataset.level = lvl
      document.documentElement.dataset.theme = theme
      const E = lvl === 'explorer'

      const IDEA = {
        explorer: {
          lead: 'Bubble sort only ever looks at two neighbors at a time.',
          points: [
            [
              'Why two at a time?',
              'It’s the easiest question there is: are these two in the right order? If not, they trade places.',
            ],
            [
              'Why start on the left?',
              'Every trade carries the bigger number one spot to the right, so the biggest gets carried all the way to the end, like a bubble rising. Starting on the right works too: then the smallest sinks to the front.',
            ],
            [
              'Why not three at a time?',
              'Three numbers can line up in 6 different ways. Two numbers need just one question: trade or not?',
            ],
            [
              'When do we stop?',
              'When we walk through the whole line without a single trade, everything must be in order.',
            ],
          ],
        },
        engineer: {
          lead: 'Compare adjacent pairs and swap any that are out of order; repeat until a pass makes no swaps.',
          points: [
            [
              'Why adjacent pairs?',
              'A pair needs exactly one comparison, a[j] > a[j+1], and at most one swap. Every step is that simple.',
            ],
            [
              'Why left to right?',
              'Each swap moves the larger value one position right, so each pass carries the maximum of the unsorted part to its final position: after pass i, the last i + 1 elements are done. Scanning right to left works symmetrically, sinking the minimum to the front.',
            ],
            [
              'Why not three at a time?',
              'Three elements have 3! = 6 possible orders, so one step would need several comparisons. Pairs keep it to one per step, which makes the cost easy to count.',
            ],
            [
              'Why stop early?',
              'A pass with no swaps proves every adjacent pair is ordered, so the list is sorted. That’s why already-sorted input takes just one pass: O(n).',
            ],
          ],
        },
      }
      const F =
        step === 1
          ? {
              arr: [5, 2, 8, 1, 9, 3],
              sw: [],
              so: [],
              ptr: {},
              cap: '',
              exp: {
                explorer: 'Here are your numbers. Let’s put them in order, smallest to biggest.',
                engineer:
                  'Bubble sort on n = 6. Each pass compares neighbours and swaps any pair that is out of order.',
              },
              cmp: 0,
              swp: 0,
            }
          : {
              arr: [2, 1, 5, 3, 8, 9],
              sw: [3, 4],
              so: [5],
              ptr: { 3: E ? 'left' : 'j', 4: E ? 'right' : 'j+1' },
              cap: E ? 'round 2' : 'pass i = 1',
              exp: {
                explorer: 'Yes! 8 is bigger, so they trade places.',
                engineer: '8 > 3, so swap a[3] and a[4]; swapped = True.',
              },
              cmp: 9,
              swp: 5,
            }
      const ROWS = [
        [0, 0, 5, 2, 1],
        [0, 1, 5, 8, 0],
        [0, 2, 8, 1, 1],
        [0, 3, 8, 9, 0],
        [0, 4, 9, 3, 1],
        [1, 0, 2, 5, 0],
        [1, 1, 5, 1, 1],
        [1, 2, 5, 8, 0],
        [1, 3, 8, 3, 1],
      ]
      const SRC = [
        'def bubble_sort(a):',
        '    n = len(a)',
        '    for i in range(n - 1):',
        '        swapped = False',
        '        for j in range(n - 1 - i):',
        '            if a[j] > a[j + 1]:',
        '                a[j], a[j + 1] = a[j + 1], a[j]',
        '                swapped = True',
        '        if not swapped:',
        '            break',
        '    return a',
      ]

      const icon = (d) =>
        `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="${d}"/></svg>`
      const I = {
        back: icon('M6 5h3v14H6zM20 5v14L10 12z'),
        play: icon('M7 4v16l13-8z'),
        step: icon('M15 5h3v14h-3zM4 5v14l10-7z'),
      }

      const stage = (mini = false) => {
        const max = Math.max(...F.arr)
        const bars = F.arr
          .map(
            (v, i) =>
              `<div class="bar ${F.sw.includes(i) ? 'swapping' : ''} ${F.so.includes(i) ? 'sorted' : ''}" style="--h:${v / max}">${v}</div>`,
          )
          .join('')
        const marks = F.arr
          .map(
            (v, i) =>
              `<div class="mark">${E ? '' : `<span class="idx">${i}</span>`}${F.ptr[i] ? `<span class="ptr">${F.ptr[i]}</span>` : ''}${F.sw.includes(i) ? `<span class="role">${E ? 'trading' : 'swapping'}</span>` : ''}${F.so.includes(i) ? `<span class="role sorted">${E ? 'done ✓' : 'sorted'}</span>` : ''}</div>`,
          )
          .join('')
        return `<section class="stage ${mini ? 'mini' : ''}" style="--n:${F.arr.length};flex:${mini ? '0 0 64px' : '1'}"><div class="cap">${F.cap}</div><div class="bars">${bars}</div><div class="marks">${marks}</div></section>`
      }
      const explain = () =>
        `<section class="explain"><h2><span>What’s happening</span>${E ? '' : `<span class="statsinline">${F.cmp} comparisons, ${F.swp} swaps</span>`}</h2><p>${F.exp[lvl]}</p></section>`
      const ideaPanel = () =>
        `<p class="lead">${IDEA[lvl].lead}</p>${IDEA[lvl].points.map(([q, a]) => `<div class="pt"><b>${q}</b><span>${a}</span></div>`).join('')}<div class="idea-go"><button>${E ? 'Got it, let’s start' : 'Start'}</button></div>`
      const tracePanel = () => {
        if (step === 1)
          return `<p style="color:var(--color-muted)">${E ? 'Rows appear here as the steps run.' : 'Rows appear here as the steps run.'}</p>`
        const head = E
          ? ['round', 'spot', 'left', 'right', 'swap?']
          : ['i', 'j', 'a[j]', 'a[j+1]', 'swap?']
        return `<table><thead><tr>${head.map((h) => `<th>${h}</th>`).join('')}</tr></thead><tbody>${ROWS.map((r, k) => `<tr class="${k === 5 ? 'grp' : ''} ${k === ROWS.length - 1 ? 'cur' : ''}"><td>${E ? r[0] + 1 : r[0]}</td><td>${E ? r[1] + 1 : r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td class="${r[4] ? 'yes' : ''}"><span>${r[4] ? 'yes' : 'no'}</span></td></tr>`).join('')}</tbody></table>`
      }
      const codePanel = () =>
        `<div class="code">${SRC.map((l, k) => `<span class="ln">${k + 1}</span><span class="${k === (step === 1 ? 1 : 6) ? 'act' : ''}">${l}</span>`).join('\n')}</div>`
      const keyPanel = () =>
        `<ul class="key"><li><span class="sw" style="background:var(--role-comparing)"></span>Looking at these two</li><li><span class="sw" style="background:var(--role-swapping)"></span>Trading places</li><li><span class="sw" style="background:var(--role-sorted)"></span>In its final spot</li></ul><p style="margin-top:14px;font-weight:700">Comparisons <span class="statsinline">${F.cmp}</span> &nbsp; Swaps <span class="statsinline">${F.swp}</span></p>`
      const numbersPanel = () =>
        `<div style="display:grid;gap:10px"><label style="font-weight:700">Your numbers</label><div class="numrow"><div class="field">5 2 8 1 9 3</div><button class="run">Run</button></div><div style="display:flex;flex-wrap:wrap;gap:8px">${(E ? ['Mixed up', 'Already in order', 'Backwards', 'Almost in order'] : ['Random', 'Already sorted', 'Reversed', 'Nearly sorted']).map((p) => `<button class="chip">${p}</button>`).join('')}</div><p style="margin:0;color:var(--color-muted);font-size:var(--text-sm)">${E ? '2 to 12 whole numbers from 0 to 99.' : '2–12 integers, 0–99, spaces or commas.'}</p></div>`
      const TABS = E
        ? [
            ['idea', 'The idea'],
            ['trace', 'So far'],
            ['key', 'Colors'],
          ]
        : [
            ['idea', 'The idea'],
            ['trace', 'Trace'],
            ['code', 'Code'],
          ]
      const panelFor = (k) =>
        ({
          idea: ideaPanel,
          trace: tracePanel,
          code: codePanel,
          key: keyPanel,
          numbers: numbersPanel,
        })[k]()
      const tabs = () =>
        `<div class="tabs" role="tablist">${TABS.map(([k, t]) => `<button class="tab" role="tab" aria-selected="${k === open}">${t}</button>`).join('')}</div>`
      const ctrls = () =>
        `<div class="ctrls"><div class="prog" style="--p:${(step / 34) * 100}%"><i></i><span>Step ${step} of 34</span></div><div class="btns"><button class="cbtn">${I.back}Back</button><button class="cbtn play">${I.play}Play</button><button class="cbtn">${I.step}Step</button><button class="cbtn speed">1×</button></div></div>`
      const vctrls = () =>
        `<div class="vctrls"><button class="cbtn">${I.back}Back</button><button class="cbtn play">${I.play}Play</button><button class="cbtn">${I.step}Step</button><button class="cbtn speed">1×</button></div>`
      const title = E ? 'Bubble the biggest to the end' : 'Bubble sort'
      const header = (extra = '') =>
        `<header class="hdr"><div class="wordmark">Stepwise</div><div class="topics">Topics</div>${extra}<div class="spacer"></div><button class="menu"><span class="burger"><i></i><i></i><i></i></span>Menu</button></header>`
      const pills = () =>
        `<div class="pills">${[['idea', 'The idea'], ['numbers', 'Numbers'], ...TABS.filter(([k]) => k !== 'idea')].map(([k, t]) => `<button class="pill" aria-expanded="${k === open}">${t}</button>`).join('')}</div>`
      const sheet = (k) =>
        `<div class="sheethead"><span>${{ idea: 'The idea', numbers: 'Your numbers', trace: E ? 'What happened so far' : 'Trace table', code: 'Code', key: 'Colors' }[k]}</span><button>Close</button></div><div class="panel">${panelFor(k)}</div>`

      let html
      if (!land && opt === 'A') {
        html = `${header()}
          <div class="band"><div class="titlerow"><div><h1>${title}</h1>${E ? '<div class="sub">Bubble sort</div>' : '<div class="sub">O(n²) worst, O(n) best. Space O(1).</div>'}</div></div>
            <div class="numrow"><div class="field">5 2 8 1 9 3</div><button class="run">Run</button></div>
            <div class="chips">${(E ? ['Mixed up', 'Already in order', 'Backwards', 'Almost in order'] : ['Random', 'Already sorted', 'Reversed', 'Nearly sorted']).map((p) => `<button class="chip">${p}</button>`).join('')}</div></div>
          ${stage()}${explain()}${tabs()}<div class="panel">${panelFor(open)}</div>${ctrls()}`
      } else if (!land && opt === 'B') {
        const isOpen = open !== 'none'
        html = `${header()}
          <div class="band" style="padding-bottom:10px"><div class="titlerow"><div><h1>${title}</h1>${E ? '' : '<div class="sub">O(n²) worst, O(n) best. Space O(1).</div>'}</div></div></div>
          ${stage(isOpen)}${explain()}${isOpen ? sheet(open) : ''}${pills()}${ctrls()}`
      } else if (land && opt === 'A') {
        html = `${header(`<div class="h-title">${title}</div><button class="hchip"><span class="nums">5 2 8 1 9 3</span>Edit</button>`)}
          <div class="main"><div class="left">${stage()}${explain()}</div><div class="right">${tabs()}<div class="panel">${panelFor(open)}</div></div></div>${ctrls()}`
      } else {
        const isOpen = open !== 'none'
        html = `${header(`<div class="h-title">${title}</div>`)}
          <div class="main"><div class="left">${stage()}${explain()}${pills()}</div>${isOpen ? `<div class="right" style="border-right:var(--border-thick) solid var(--color-line)">${sheet(open)}</div>` : ''}${vctrls()}</div>`
      }
      document.getElementById('root').innerHTML =
        `<div class="app ${land ? 'land' : ''} ${opt} ${open !== 'none' ? 'open' : ''}">${html}</div>`
    </script>
  </body>
</html>
