<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Headings use Archivo; fetch it alongside the JS instead of after the first render. -->
    <link
      rel="preload"
      href="./node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Stepwise</title>
    <meta
      name="description"
      content="Learn data structures and algorithms by stepping through them one move at a time, with explanations for beginners and for engineers."
    />
    <!--
      Link preview cards (WhatsApp, Slack, social media). Crawlers don't run JavaScript, so
      every page shares these. URLs must be absolute; the image source is design/og/.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stepwise" />
    <meta property="og:title" content="Stepwise: watch algorithms run, one step at a time" />
    <meta
      property="og:description"
      content="Step through bubble sort on your own numbers, with every step explained in plain words or precise ones."
    />
    <meta property="og:url" content="https://stepwise-lab.pages.dev/" />
    <meta property="og:image" content="https://stepwise-lab.pages.dev/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Bubble sort mid-swap: the 8 hops over the 3 as they trade places, with the explanation “Yes! 8 is bigger, so they trade places.”"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stepwise: watch algorithms run, one step at a time" />
    <meta
      name="twitter:description"
      content="Step through bubble sort on your own numbers, with every step explained in plain words or precise ones."
    />
    <meta name="twitter:image" content="https://stepwise-lab.pages.dev/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Bubble sort mid-swap: the 8 hops over the 3 as they trade places, with the explanation “Yes! 8 is bigger, so they trade places.”"
    />
    <!--
      Apply the saved theme and level before first paint, so a saved dark theme never
      flashes white. Mirrors PreferencesProvider. Keep this tiny and self-contained. The CSP in
      public/_headers allows it by hash: after changing it, update that hash (npm run check
      prints the new one).
    -->
    <script>
      try {
        var t = localStorage.getItem('stepwise:theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
        var l = localStorage.getItem('stepwise:level')
        if (l === 'explorer' || l === 'engineer') document.documentElement.dataset.level = l
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
