<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Headings use Archivo; fetch it alongside the JS instead of after the first render. -->
    <link
      rel="preload"
      href="./node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stepwise</title>
    <meta
      name="description"
      content="Learn data structures and algorithms by stepping through them one move at a time, with explanations for beginners and for engineers."
    />
    <!--
      Apply the saved theme and level before first paint, so a saved dark theme never
      flashes white. Mirrors PreferencesProvider. Keep this tiny and self-contained: it will
      need a CSP hash when security headers are added (see docs/ROADMAP.md).
    -->
    <script>
      try {
        var t = localStorage.getItem('stepwise:theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
        var l = localStorage.getItem('stepwise:level')
        if (l === 'explorer' || l === 'engineer') document.documentElement.dataset.level = l
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
