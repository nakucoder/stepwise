name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Runs on main are never cancelled, so a
# production deploy can't be stopped halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PAGES_PROJECT: stepwise-lab
  # Exact Wrangler version for the deploy jobs. Dependabot doesn't update this; bump it by hand.
  WRANGLER_VERSION: 4.147.0

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the CSP hash of the no-flash script
        run: npm run check:csp

      # The deploy jobs ship exactly this build: the one that passed every check above.
      - name: Upload the build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 3

  deploy-preview:
    name: deploy-preview
    needs: ci
    # Pull requests from forks can't read the Cloudflare secrets, so they get no preview.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download the build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      # Branch names are user input; keep only characters that are safe in a command and a URL.
      - name: Name the preview after the branch
        id: branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: echo "name=$(printf '%s' "$HEAD_REF" | tr -c 'A-Za-z0-9-' '-')" >> "$GITHUB_OUTPUT"

      - name: Deploy a preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          # Creates the Pages project on the very first deploy; does nothing after that.
          preCommands: >-
            npx wrangler pages project list | grep -qw "$PAGES_PROJECT" ||
            npx wrangler pages project create "$PAGES_PROJECT" --production-branch=main
          command: >-
            pages deploy dist --project-name=${{ env.PAGES_PROJECT }}
            --branch=${{ steps.branch.outputs.name }} --commit-hash=${{ github.event.pull_request.head.sha }}
            --commit-dirty=true

      - name: Post the preview link on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          body="**Preview deployed** for ${SHA:0:7}: $URL"
          if [ -n "$ALIAS" ]; then body="$body"$'\n\n'"Always the latest push to this branch: $ALIAS"; fi
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "$body"

  deploy-production:
    name: deploy-production
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://stepwise-lab.pages.dev
    # One production deploy at a time, in order; never cancel one that has started.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Download the build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          preCommands: >-
            npx wrangler pages project list | grep -qw "$PAGES_PROJECT" ||
            npx wrangler pages project create "$PAGES_PROJECT" --production-branch=main
          command: >-
            pages deploy dist --project-name=${{ env.PAGES_PROJECT }} --branch=main
            --commit-hash=${{ github.sha }} --commit-dirty=true
