version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Keep in sync with .nvmrc: bump the major by hand when .nvmrc changes.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # Blocked until typescript-eslint supports TS 7. See #5:
      # https://github.com/nakucoder/stepwise/issues/5
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
